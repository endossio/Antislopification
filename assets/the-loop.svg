<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8E9592"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="799" height="249" rx="12" fill="#FFFFFF" stroke="#DBE0DF"/>

  <rect x="28" y="32" width="220" height="80" rx="8" fill="#F1F4F3"/>
  <text x="138" y="64" text-anchor="middle" font-size="14" font-weight="600" fill="#0B1A14">Made with AI</text>
  <text x="138" y="86" text-anchor="middle" font-size="11.5" fill="#4D5552">longer than it needs to be</text>

  <rect x="290" y="32" width="220" height="80" rx="8" fill="#F1F4F3"/>
  <text x="400" y="64" text-anchor="middle" font-size="14" font-weight="600" fill="#0B1A14">Recipient's AI</text>
  <text x="400" y="86" text-anchor="middle" font-size="11.5" fill="#4D5552">summarises and edits it</text>

  <rect x="552" y="32" width="220" height="80" rx="8" fill="#F1F4F3"/>
  <text x="662" y="64" text-anchor="middle" font-size="14" font-weight="600" fill="#0B1A14">Sender's AI</text>
  <text x="662" y="86" text-anchor="middle" font-size="11.5" fill="#4D5552">summarises the edits</text>

  <line x1="248" y1="72" x2="287" y2="72" stroke="#8E9592" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="510" y1="72" x2="549" y2="72" stroke="#8E9592" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M662 112 C662 152, 400 152, 400 116" fill="none" stroke="#8E9592" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="531" y="160" text-anchor="middle" font-size="12" fill="#4D5552">and so on</text>

  <text x="28" y="196" font-size="12" fill="#4D5552">What gets sent</text>
  <rect x="28" y="206" width="744" height="18" rx="4" fill="#E4E8E7"/>
  <rect x="402" y="206" width="62" height="18" fill="#0B1A14"/>
  <text x="472" y="220" font-size="12" font-weight="600" fill="#0B1A14">the useful part</text>
</svg>
